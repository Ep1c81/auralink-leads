name: BizMapShield isolated validation
on:
  push:
    branches: ['bizmapshield/ci-validation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: validation
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local_test_only@localhost:5432/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify isolated PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select version();'
      - name: Build baseline
        run: npm run build
