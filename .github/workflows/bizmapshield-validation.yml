name: BizMapShield isolated validation
on:
  push:
    branches: ['bizmapshield/ci-validation']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bizmapshield-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: validation
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local_test_only@localhost:5432/validation
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL reservation tests
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/acquisition-db.sql
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Unit tests (network-free)
        run: node --test tests/acquisition.test.mjs tests/make-dispatch.test.mjs tests/funnel.test.mjs
      - name: Build application
        run: npm run build
